plugins {
  id 'java'
  id 'scala'
  id 'antlr'
  id 'idea'
  id 'com.github.maiflai.scalatest' version '0.23'
}

group 'io.truedat'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
  jcenter()
}

dependencies {
  antlr group: 'org.antlr', name: 'antlr4', version: '4.7.2'
  runtime group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
  compile group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'
  compile group: 'org.antlr', name: 'antlr4-runtime', version: '4.7.2'
  compile group: 'org.scala-lang', name: 'scala-library', version: '2.12.8'
  compile group: 'com.typesafe.scala-logging', name: 'scala-logging_2.12', version: '3.9.2'
  testCompile 'junit:junit:4.12'
  testCompile group: 'org.scalatest', name: 'scalatest_2.12', version: '3.0.5'
  testRuntime 'org.pegdown:pegdown:1.4.2'
}
 
generateGrammarSource {
  maxHeapSize = '64m'
  arguments += ['-package', 'io.truedat', '-visitor']
  outputDirectory = new File('generated-src/antlr/main/io/truedat'.toString())
}
sourceSets {
  main {
    java {
      srcDirs 'src/main/java', 'generated-src/antlr/main/'
    }
  }
  generated {
    java.srcDir 'generated-src/antlr/main/'
  }
}
compileJava {
  dependsOn generateGrammarSource
  source sourceSets.generated.java, sourceSets.main.java
}
compileScala {
  dependsOn generateGrammarSource
  source sourceSets.generated.java, sourceSets.main.java, sourceSets.main.scala
  scalaCompileOptions.additionalParameters = ["-feature"]
}
compileTestScala {
  scalaCompileOptions.additionalParameters = ["-feature"]
}


clean {
  delete 'generated-src'
}

idea {
  module {
    generatedSourceDirs += file('generated-src/antlr/main')
  }
}

